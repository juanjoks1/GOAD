plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cienaga.prototipo'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cienaga.prototipo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    // El juego es el build de Vite: `npm run build` deja dist/ y se empaqueta tal cual en assets/.
    sourceSets {
        main {
            assets.srcDirs = ['../../dist']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
